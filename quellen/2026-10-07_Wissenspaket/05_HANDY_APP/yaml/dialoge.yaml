                    !IsBlank(LookUp(Tischbuchungen, Tisch.Value = varTischName && Startzeit < varNeuEnde && Endzeit > varEndeAlt).ID),
                    Notify("Der Tisch ist in dieser Zeit schon belegt.", NotificationType.Warning),
