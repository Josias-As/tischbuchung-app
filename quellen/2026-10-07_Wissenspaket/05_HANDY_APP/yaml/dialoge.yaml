- conDlgVerwalten:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: =30
      Y: =(Parent.Height - 800) / 2
      Width: =Parent.Width - 60
      Height: =800
      Fill: =RGBA(255, 255, 255, 1)
      RadiusBottomLeft: =28
      RadiusBottomRight: =28
      RadiusTopLeft: =28
      RadiusTopRight: =28
      Visible: =varZeigeVerwalten && !varZeigeStorno
    Children:
      - lblDlgTitel:
          Control: Label@2.5.1
          Properties:
            Text: =varBuchung.Tisch.Value
            X: =36
            Y: =28
            Width: =Parent.Width - 72
