- conDlgStorno:
    Control: GroupContainer@1.5.0
    Variant: ManualLayout
    Properties:
      X: =30
      Y: =(Parent.Height - 620) / 2
      Width: =Parent.Width - 60
      Height: =620
      Fill: =RGBA(255, 255, 255, 1)
      RadiusBottomLeft: =28
      RadiusBottomRight: =28
      RadiusTopLeft: =28
      RadiusTopRight: =28
      Visible: =varZeigeStorno
    Children:
      - lblStornoFrage:
          Control: Label@2.5.1
          Properties:
            Text: ="Buchung wirklich stornieren?"
            X: =36
            Y: =36
            Width: =Parent.Width - 72
            Height: =76
            Size: =30
            FontWeight: =FontWeight.Semibold
            Color: =RGBA(32, 54, 71, 1)
            Font: =Font.'Open Sans'
            Wrap: =true
      - lblStornoDetail:
          Control: Label@2.5.1
          Properties:
            Text: |-
              =varBuchung.Tisch.Value & "
              " & Text(varBuchung.Startzeit, "dddd, dd.mm.yyyy") & "
              " & Text(varBuchung.Startzeit, "hh:mm") & " bis " & Text(varBuchung.Endzeit, "hh:mm")
            X: =36
            Y: =126
            Width: =Parent.Width - 72
            Height: =170
            Size: =24
            Color: =RGBA(90, 90, 90, 1)
            Font: =Font.'Open Sans'
            Wrap: =true
      - btnStornoJa:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Ja, stornieren"
            X: =36
            Y: =320
            Width: =Parent.Width - 72
            Height: =110
            Size: =26
            Font: =Font.'Open Sans'
            FontWeight: =FontWeight.Semibold
            Fill: =RGBA(235, 57, 81, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =RGBA(235, 57, 81, 1)
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(255, 255, 255, 1)
            PressedColor: =RGBA(235, 57, 81, 1)
            DisabledFill: =RGBA(222, 222, 222, 1)
            DisabledColor: =RGBA(120, 120, 120, 1)
            DisabledBorderColor: =RGBA(222, 222, 222, 1)
            BorderColor: =RGBA(235, 57, 81, 1)
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
            OnSelect: |-
              =If(
                !varIsLoading && Now() >= varSperreBis,
                Set(varIsLoading, true);
                Set(varBuchung, LookUp(Tischbuchungen, ID = varBuchungID));
                If(
                  IsBlank(varBuchung.ID),
                  Notify("Diese Buchung gibt es nicht mehr. Die Liste wird aktualisiert.", NotificationType.Warning);
                  Set(varZeigeStorno, false);
                  Set(varZeigeVerwalten, false),
                  IfError(
                    Remove(Tischbuchungen, varBuchung),
                    Notify("Das Stornieren ist fehlgeschlagen. Bitte erneut versuchen.", NotificationType.Error),
                    If(
                      IsBlank(LookUp(Tischbuchungen, ID = varBuchungID).ID),
                      Notify("Buchung storniert.", NotificationType.Success);
                      Set(varZeigeStorno, false);
                      Set(varZeigeVerwalten, false),
                      Notify("Die Stornierung ist nicht angekommen. Bitte aktualisieren.", NotificationType.Warning)
                    )
                  )
                );
                Set(varNeuLaden, varNeuLaden + 1);
                Set(varSperreBis, DateAdd(Now(), 2, TimeUnit.Seconds));
                Set(varIsLoading, false)
              )
      - btnStornoAbbrechen:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Abbrechen"
            X: =36
            Y: =450
            Width: =Parent.Width - 72
            Height: =110
            Size: =26
