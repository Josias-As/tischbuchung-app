            PressedFill: =RGBA(240, 240, 240, 1)
            PressedColor: =RGBA(90, 90, 90, 1)
            BorderColor: =RGBA(190, 190, 190, 1)
            BorderThickness: =2
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            OnSelect: =Set(varZeigeStorno, false)