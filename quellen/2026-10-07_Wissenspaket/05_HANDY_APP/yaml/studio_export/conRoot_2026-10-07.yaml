- conRoot:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      Fill: =RGBA(247, 247, 247, 1)
      Height: =Parent.Height
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutDirection: =LayoutDirection.Vertical
      Width: =Parent.Width
    Children:
      - conHeader:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(255, 255, 255, 1)
            FillPortions: =0
            Height: =170
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutGap: =10
            LayoutMinHeight: =0
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - imgLogo_1:
                Control: Image@2.2.3
                Properties:
                  Height: =44
                  Image: ="data:image/png;base64,"
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =170
            - lblKopfTitel_1:
                Control: Label@2.5.1
                Properties:
                  Color: =RGBA(23, 20, 150, 1)
                  FillPortions: =1
                  Font: =Font.'Open Sans'
                  FontWeight: =FontWeight.Semibold
                  Height: =80
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =10
                  Size: =23
                  Text: ="Tischbuchung"
                  Wrap: =false
            - icoAktualisieren_1:
                Control: Classic/Icon@2.5.0
                Properties:
                  Color: =RGBA(23, 20, 150, 1)
                  Height: =96
                  Icon: =Icon.Sync
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  OnSelect: |-
                    =Set(varIsLoading, true);
                    Refresh(Tischbuchungen);
                    Refresh(Tische);
                    Set(varNeuLaden, varNeuLaden + 1);
                    Set(varIsLoading, false);
                    Notify("Aktualisiert.", NotificationType.Success)
                  PaddingBottom: =24
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =24
                  Tooltip: ="Daten aktualisieren"
                  Width: =96
            - btnInitialen_1:
                Control: Classic/Button@2.2.0
                Properties:
                  BorderColor: =RGBA(23, 20, 150, 1)
                  Color: =RGBA(255, 255, 255, 1)
                  DisplayMode: =DisplayMode.View
                  Fill: =RGBA(23, 20, 150, 1)
                  Font: =Font.'Open Sans'
                  Height: =96
                  HoverColor: =RGBA(255, 255, 255, 1)
                  HoverFill: =RGBA(23, 20, 150, 1)
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PressedColor: =RGBA(255, 255, 255, 1)
                  PressedFill: =RGBA(23, 20, 150, 1)
                  RadiusBottomLeft: =48
                  RadiusBottomRight: =48
                  RadiusTopLeft: =48
                  RadiusTopRight: =48
                  Size: =26
                  Text: |-
                    =With(
                      { teile: Split(User().FullName, " ") },
                      Upper(Left(First(teile).Value, 1) & Left(Last(teile).Value, 1))
                    )
                  Tooltip: =User().FullName
                  Width: =96
      - conInhalt:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
          Children:
            - conBuchen:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varTab = "buchen"
                Children:
                  - conBuchenForm:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =14
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =16
                        PaddingLeft: =32
                        PaddingRight: =32
                      Children:
                        - lblBuchenTitel:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(23, 20, 150, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =110
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =34
                              Text: ="Tisch buchen"
                        - lblDatumL:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(90, 90, 90, 1)
                              Font: =Font.'Open Sans'
                              Height: =48
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =22
                              Text: ="Datum"
                              VerticalAlign: =VerticalAlign.Bottom
                        - ddDatum:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AccessibleLabel: ="Datum"
                              BorderColor: =RGBA(190, 190, 190, 1)
                              ChevronBackground: =RGBA(23, 20, 150, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =RGBA(23, 20, 150, 1)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(32, 54, 71, 1)
                              DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Open Sans'
                              Height: =96
                              HoverFill: =RGBA(230, 232, 245, 1)
                              Items: |-
                                =ForAll(
                                  Sequence(60, If(Hour(Now()) >= 22, 1, 0)) As n,
                                  {
                                    Value: If(n.Value = 0, "Heute, ", n.Value = 1, "Morgen, ", "") & Text(DateAdd(Today(), n.Value, TimeUnit.Days), "dddd, dd.mm.yyyy"),
                                    Tag: DateAdd(Today(), n.Value, TimeUnit.Days)
                                  }
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =20
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(23, 20, 150, 1)
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(23, 20, 150, 1)
                              Size: =26
                        - conZeiten:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =160
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                            Children:
                              - conVon:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =14
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lblVonL:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(90, 90, 90, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =48
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =22
                                          Text: ="Von"
                                          VerticalAlign: =VerticalAlign.Bottom
                                    - ddStart:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AccessibleLabel: ="Beginn"
                                          BorderColor: =RGBA(190, 190, 190, 1)
                                          ChevronBackground: =RGBA(23, 20, 150, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverBackground: =RGBA(23, 20, 150, 1)
                                          ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                          Color: =RGBA(32, 54, 71, 1)
                                          DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                          Font: =Font.'Open Sans'
                                          Height: =96
                                          HoverFill: =RGBA(230, 232, 245, 1)
                                          Items: |-
                                            =With(
                                              { ab: If(ddDatum.Selected.Tag = Today(), 30 * RoundDown((Hour(Now()) * 60 + Minute(Now())) / 30, 0), 8 * 60) },
                                              ForAll(
                                                Sequence(Max(0, (21 * 60 + 30 - ab) / 30 + 1), 0) As n,
                                                {
                                                  Value: Text(Time(RoundDown((ab + n.Value * 30) / 60, 0), Mod(ab + n.Value * 30, 60), 0), "hh:mm"),
                                                  Min: ab + n.Value * 30
                                                }
                                              )
                                            )
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =20
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(23, 20, 150, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(23, 20, 150, 1)
                                          Size: =26
                              - conBis:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutAlignItems: =LayoutAlignItems.Stretch
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =14
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                  Children:
                                    - lblBisL:
                                        Control: Label@2.5.1
                                        Properties:
                                          Color: =RGBA(90, 90, 90, 1)
                                          Font: =Font.'Open Sans'
                                          Height: =48
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          Size: =22
                                          Text: ="Bis"
                                          VerticalAlign: =VerticalAlign.Bottom
                                    - ddEnde:
                                        Control: Classic/DropDown@2.3.1
                                        Properties:
                                          AccessibleLabel: ="Ende"
                                          BorderColor: =RGBA(190, 190, 190, 1)
                                          ChevronBackground: =RGBA(23, 20, 150, 1)
                                          ChevronFill: =RGBA(255, 255, 255, 1)
                                          ChevronHoverBackground: =RGBA(23, 20, 150, 1)
                                          ChevronHoverFill: =RGBA(255, 255, 255, 1)
                                          Color: =RGBA(32, 54, 71, 1)
                                          Default: =If(ddStart.Selected.Min < 17 * 60, "17:00", "")
                                          DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                                          Font: =Font.'Open Sans'
                                          Height: =96
                                          HoverFill: =RGBA(230, 232, 245, 1)
                                          Items: |-
                                            =With(
                                              { s: ddStart.Selected.Min },
                                              ForAll(
                                                Sequence(Max(0, (22 * 60 - s) / 30), 1) As n,
                                                {
                                                  Value: Text(Time(RoundDown((s + n.Value * 30) / 60, 0), Mod(s + n.Value * 30, 60), 0), "hh:mm"),
                                                  Min: s + n.Value * 30
                                                }
                                              )
                                            )
                                          Items.Value: =Value
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          PaddingLeft: =20
                                          PressedColor: =RGBA(255, 255, 255, 1)
                                          PressedFill: =RGBA(23, 20, 150, 1)
                                          SelectionColor: =RGBA(255, 255, 255, 1)
                                          SelectionFill: =RGBA(23, 20, 150, 1)
                                          Size: =26
                        - lblTischL:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(90, 90, 90, 1)
                              Font: =Font.'Open Sans'
                              Height: =48
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =22
                              Text: ="Freier Tisch in dieser Zeit"
                              VerticalAlign: =VerticalAlign.Bottom
                        - ddTisch:
                            Control: Classic/DropDown@2.3.1
                            Properties:
                              AccessibleLabel: ="Freier Tisch"
                              BorderColor: =RGBA(190, 190, 190, 1)
                              ChevronBackground: =RGBA(23, 20, 150, 1)
                              ChevronFill: =RGBA(255, 255, 255, 1)
                              ChevronHoverBackground: =RGBA(23, 20, 150, 1)
                              ChevronHoverFill: =RGBA(255, 255, 255, 1)
                              Color: =RGBA(32, 54, 71, 1)
                              DisplayMode: =If(varIsLoading, DisplayMode.Disabled, DisplayMode.Edit)
                              Font: =Font.'Open Sans'
                              Height: =96
                              HoverFill: =RGBA(230, 232, 245, 1)
                              Items: |-
                                =With(
                                  { neuLaden: varNeuLaden },
                                  With(
                                    { belegt: ForAll(Filter(Tischbuchungen, Startzeit < DateAdd(ddDatum.Selected.Tag, ddEnde.Selected.Min, TimeUnit.Minutes) && Endzeit > DateAdd(ddDatum.Selected.Tag, ddStart.Selected.Min, TimeUnit.Minutes)), Tisch.Value) },
                                    ForAll(
                                      Sort(
                                        Filter(colTische, !("big table" in Lower(Titel)) && !(Titel in belegt)),
                                        Geschoss.Value & Left(Titel, Len(Titel) - Len(Last(Split(Titel, " ")).Value)) & Text(IfError(Value(Last(Split(Titel, " ")).Value), 0), "000")
                                      ) As t,
                                      { Value: t.Titel, ID: t.ID }
                                    )
                                  )
                                )
                              Items.Value: =Value
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =20
                              PressedColor: =RGBA(255, 255, 255, 1)
                              PressedFill: =RGBA(23, 20, 150, 1)
                              SelectionColor: =RGBA(255, 255, 255, 1)
                              SelectionFill: =RGBA(23, 20, 150, 1)
                              Size: =26
                        - lblZusammenfassung:
                            Control: Label@2.5.1
                            Properties:
                              Color: =If(IsBlank(ddTisch.Selected.Value), RGBA(235, 57, 81, 1), RGBA(23, 20, 150, 1))
                              Fill: =RGBA(238, 240, 250, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =170
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingLeft: =24
                              PaddingRight: =24
                              Size: =24
                              Text: |-
                                =If(
                                  IsBlank(ddTisch.Selected.Value),
                                  "Im gewählten Zeitraum ist kein Tisch frei. Bitte eine andere Zeit wählen.",
                                  ddTisch.Selected.Value & Char(10) & Text(ddDatum.Selected.Tag, "dddd, dd.mm.yyyy") & Char(10) & ddStart.Selected.Value & " bis " & ddEnde.Selected.Value & " Uhr"
                                )
                        - btnBuchen:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =RGBA(0, 169, 107, 1)
                              Color: =RGBA(255, 255, 255, 1)
                              DisabledBorderColor: =RGBA(222, 222, 222, 1)
                              DisabledColor: =RGBA(120, 120, 120, 1)
                              DisabledFill: =RGBA(222, 222, 222, 1)
                              DisplayMode: =If(varIsLoading || IsBlank(ddTisch.Selected.Value), DisplayMode.Disabled, DisplayMode.Edit)
                              Fill: =RGBA(0, 169, 107, 1)
                              Font: =Font.'Open Sans'
                              Height: =110
                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(0, 169, 107, 1)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: |-
                                =If(
                                  !varIsLoading && Now() >= varSperreBis,
                                  Set(varIsLoading, true);
                                  Set(varBuchStart, DateAdd(ddDatum.Selected.Tag, ddStart.Selected.Min, TimeUnit.Minutes));
                                  Set(varBuchEnde, DateAdd(ddDatum.Selected.Tag, ddEnde.Selected.Min, TimeUnit.Minutes));
                                  Set(varTagesEnde, DateAdd(ddDatum.Selected.Tag, 22 * 60, TimeUnit.Minutes));
                                  Set(varTischName, ddTisch.Selected.Value);
                                  Set(varTischID, ddTisch.Selected.ID);
                                  If(
                                    IsBlank(varTischName) || IsBlank(varTischID) || IsBlank(ddStart.Selected.Min) || IsBlank(ddEnde.Selected.Min),
                                    Notify("Bitte Datum, Uhrzeit und Tisch auswählen.", NotificationType.Warning),
                                    varBuchEnde <= varBuchStart,
                                    Notify("Das Ende muss nach dem Beginn liegen.", NotificationType.Warning),
                                    varBuchStart < DateAdd(Today(), 30 * RoundDown((Hour(Now()) * 60 + Minute(Now())) / 30, 0), TimeUnit.Minutes),
                                    Notify("Diese Zeit liegt in der Vergangenheit. Bitte eine spätere Zeit wählen.", NotificationType.Warning),
                                    varBuchEnde > varTagesEnde,
                                    Notify("Eine Buchung kann nicht nach 22:00 Uhr enden.", NotificationType.Warning),
                                    !IsBlank(LookUp(Tischbuchungen, Tisch.Value = varTischName && Startzeit < varBuchEnde && Endzeit > varBuchStart).ID),
                                    Notify("Der Tisch ist in dieser Zeit schon belegt. Bitte einen anderen Tisch wählen.", NotificationType.Warning),
                                    !IsBlank(LookUp(Tischbuchungen, Person.Email = User().Email && Startzeit < varBuchEnde && Endzeit > varBuchStart).ID),
                                    Notify("Du hast in dieser Zeit schon einen Tisch gebucht.", NotificationType.Warning),
                                    IfError(
                                      Patch(
                                        Tischbuchungen,
                                        Defaults(Tischbuchungen),
                                        {
                                          Tisch: { Id: varTischID, Value: varTischName },
                                          Startzeit: varBuchStart,
                                          Endzeit: varBuchEnde,
                                          Person: {
                                            Claims: "i:0#.f|membership|" & Lower(User().Email),
                                            Department: "",
                                            DisplayName: User().FullName,
                                            Email: User().Email,
                                            JobTitle: "",
                                            Picture: ""
                                          }
                                        }
                                      ),
                                      Notify("Das Buchen ist fehlgeschlagen. Bitte erneut versuchen.", NotificationType.Error),
                                      ClearCollect(colKollision, Filter(Tischbuchungen, Tisch.Value = varTischName && Startzeit < varBuchEnde && Endzeit > varBuchStart));
                                      Set(varBuchung, LookUp(colKollision, Person.Email = User().Email && Startzeit = varBuchStart && Endzeit = varBuchEnde));
                                      If(
                                        IsBlank(varBuchung.ID),
                                        Notify("Die Buchung ist nicht angekommen. Bitte unter „Meine“ prüfen.", NotificationType.Warning),
                                        Set(varBuchungID, varBuchung.ID);
                                        If(
                                          !IsBlank(LookUp(colKollision, ID < varBuchungID).ID),
                                          Notify("Achtung: Jemand hat diesen Tisch fast gleichzeitig vor dir gebucht. Bitte storniere deine Buchung unter „Meine“ und wähle einen anderen Tisch.", NotificationType.Error),
                                          Notify("Gebucht: " & varTischName & ", " & Text(varBuchStart, "dd.mm.") & ", " & Text(varBuchStart, "hh:mm") & " bis " & Text(varBuchEnde, "hh:mm") & " Uhr", NotificationType.Success);
                                          Set(varTab, If(varBuchStart < DateAdd(Today(), 1, TimeUnit.Days), "heute", "meine"))
                                        )
                                      )
                                    )
                                  );
                                  Set(varNeuLaden, varNeuLaden + 1);
                                  Set(varSperreBis, DateAdd(Now(), 2, TimeUnit.Seconds));
                                  Set(varIsLoading, false)
                                )
                              PressedColor: =RGBA(0, 169, 107, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
                              Size: =28
                              Text: ="Jetzt buchen"
            - conMeine:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varTab = "meine"
                Children:
                  - lblMeineTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(23, 20, 150, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =120
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =32
                        Size: =34
                        Text: ="Meine Buchungen"
                  - lblMeineLeer:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(90, 90, 90, 1)
                        Font: =Font.'Open Sans'
                        Height: =110
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =32
                        Size: =26
                        Text: ="Du hast keine kommenden Buchungen."
                        Visible: =galMeine.AllItemsCount = 0
                  - galMeine:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Items: |-
                          =With(
                            { neuLaden: varNeuLaden },
                            SortByColumns(
                              Filter(Tischbuchungen, Person.Email = User().Email && Endzeit >= Now()),
                              "Startzeit",
                              SortOrder.Ascending
                            )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =260
                      Children:
                        - conKarteM:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =236
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              Width: =Parent.TemplateWidth - 48
                              X: =24
                              Y: =12
                            Children:
                              - lblTischM:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(32, 54, 71, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =58
                                    Size: =30
                                    Text: =ThisItem.Tisch.Value
                                    Width: =Parent.Width - 250
                                    X: =28
                                    Y: =18
                              - lblTagM:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(90, 90, 90, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =50
                                    Size: =24
                                    Text: =Text(ThisItem.Startzeit, "dddd, dd.mm.yyyy")
                                    Width: =Parent.Width - 250
                                    X: =28
                                    Y: =78
                              - lblZeitM:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(23, 20, 150, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =58
                                    Size: =28
                                    Text: =Text(ThisItem.Startzeit, "hh:mm") & " bis " & Text(ThisItem.Endzeit, "hh:mm")
                                    Width: =Parent.Width - 250
                                    X: =28
                                    Y: =132
                              - btnVerwaltenM:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(23, 20, 150, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(23, 20, 150, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =96
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(23, 20, 150, 1)
                                    OnSelect: |-
                                      =Set(varBuchung, ThisItem);
                                      Set(varBuchungID, ThisItem.ID);
                                      Set(varZeigeVerwalten, true)
                                    PressedColor: =RGBA(23, 20, 150, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    RadiusBottomLeft: =14
                                    RadiusBottomRight: =14
                                    RadiusTopLeft: =14
                                    RadiusTopRight: =14
                                    Text: ="Verwalten"
                                    Width: =200
                                    X: =Parent.Width - 228
                                    Y: =70
            - conHeute:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Visible: =varTab = "heute"
                Children:
                  - lblHeuteTitel:
                      Control: Label@2.5.1
                      Properties:
                        Color: =RGBA(23, 20, 150, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =120
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =32
                        Size: =34
                        Text: ="Heute, " & Text(Today(), "dddd dd.mm.")
                  - conHeuteLeer:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        FillPortions: =0
                        Height: =300
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =24
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingLeft: =32
                        PaddingRight: =32
                        Visible: =galHeute.AllItemsCount = 0
                      Children:
                        - lblHeuteLeer:
                            Control: Label@2.5.1
                            Properties:
                              Color: =RGBA(90, 90, 90, 1)
                              Font: =Font.'Open Sans'
                              Height: =120
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Size: =26
                              Text: ="Du hast heute keinen Tisch gebucht."
                        - btnZumBuchen:
