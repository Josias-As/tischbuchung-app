                  - galHeute:
                      Control: Gallery@2.15.0
                      Variant: Vertical
                      Properties:
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Items: |-
                          =With(
                            { neuLaden: varNeuLaden },
                            SortByColumns(
                              Filter(
                                Tischbuchungen,
                                Person.Email = User().Email && Startzeit >= Today() && Startzeit < DateAdd(Today(), 1, TimeUnit.Days) && Endzeit >= Now()
                              ),
                              "Startzeit",
                              SortOrder.Ascending
                            )
                          )
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        ShowScrollbar: =false
                        TemplatePadding: =0
                        TemplateSize: =300
                      Children:
                        - conKarteH:
                            Control: GroupContainer@1.5.0
                            Variant: ManualLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              Height: =276
                              RadiusBottomLeft: =20
                              RadiusBottomRight: =20
                              RadiusTopLeft: =20
                              RadiusTopRight: =20
                              Width: =Parent.TemplateWidth - 48
                              X: =24
                              Y: =12
                            Children:
                              - lblTischH:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(32, 54, 71, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =58
                                    Size: =30
                                    Text: =ThisItem.Tisch.Value
                                    Width: =Parent.Width - 300
                                    X: =28
                                    Y: =16
                              - lblStatusH:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =If(ThisItem.CheckedIn, RGBA(0, 169, 107, 1), RGBA(255, 165, 0, 1))
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =52
                                    Text: =If(ThisItem.CheckedIn, "Eingecheckt", "Nicht eingecheckt")
                                    Width: =302
                                    Wrap: =false
                                    X: =Parent.Width - 330
                                    Y: =20
                              - lblZeitH:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =RGBA(23, 20, 150, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Semibold
                                    Height: =58
                                    Size: =28
                                    Text: =Text(ThisItem.Startzeit, "hh:mm") & " bis " & Text(ThisItem.Endzeit, "hh:mm")
                                    Width: =Parent.Width - 56
                                    X: =28
                                    Y: =76
                              - btnEincheckenH:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(0, 169, 107, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    DisabledBorderColor: =RGBA(222, 222, 222, 1)
                                    DisabledColor: =RGBA(120, 120, 120, 1)
                                    DisabledFill: =RGBA(222, 222, 222, 1)
                                    DisplayMode: |-
                                      =If(
                                        ThisItem.CheckedIn,
                                        DisplayMode.Disabled,
                                        If(
                                          varIsLoading,
                                          DisplayMode.Disabled,
                                          If(
                                            Now() >= DateAdd(ThisItem.Startzeit, -30, TimeUnit.Minutes) && Now() <= ThisItem.Endzeit,
                                            DisplayMode.Edit,
                                            DisplayMode.Disabled
                                          )
                                        )
                                      )
                                    Fill: =RGBA(0, 169, 107, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =100
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(0, 169, 107, 1)
                                    OnSelect: |-
                                      =If(
                                        !varIsLoading && Now() >= varSperreBis,
                                        Set(varIsLoading, true);
                                        Set(varBuchungID, ThisItem.ID);
                                        With(
                                          { frisch: LookUp(Tischbuchungen, ID = varBuchungID) },
                                          If(
                                            IsBlank(frisch.ID),
                                            Notify("Diese Buchung gibt es nicht mehr. Bitte aktualisieren.", NotificationType.Warning),
                                            If(
                                              frisch.CheckedIn,
                                              Notify("Du bist bereits eingecheckt.", NotificationType.Information),
                                              If(
                                                Now() < DateAdd(frisch.Startzeit, -30, TimeUnit.Minutes) || Now() > frisch.Endzeit,
                                                Notify("Einchecken ist erst ab 30 Minuten vor Beginn und nur bis zum Ende moeglich.", NotificationType.Warning),
                                                IfError(
                                                  Patch(Tischbuchungen, frisch, { CheckedIn: true }),
                                                  Notify("Einchecken fehlgeschlagen. Bitte erneut versuchen.", NotificationType.Error),
                                                  If(
                                                    LookUp(Tischbuchungen, ID = varBuchungID).CheckedIn,
                                                    Notify("Eingecheckt.", NotificationType.Success),
                                                    Notify("Der Check-in ist nicht angekommen. Bitte aktualisieren und erneut versuchen.", NotificationType.Warning)
                                                  )
                                                )
                                              )
                                            )
                                          )
                                        );
                                        Set(varNeuLaden, varNeuLaden + 1);
                                        Set(varSperreBis, DateAdd(Now(), 2, TimeUnit.Seconds));
                                        Set(varIsLoading, false)
                                      )
                                    PressedColor: =RGBA(0, 169, 107, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    Text: =If(ThisItem.CheckedIn, "Eingecheckt", "Einchecken")
                                    Width: =(Parent.Width - 80) / 2
                                    X: =28
                                    Y: =150
                              - btnVerwaltenH:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =RGBA(23, 20, 150, 1)
                                    Color: =RGBA(255, 255, 255, 1)
                                    Fill: =RGBA(23, 20, 150, 1)
                                    Font: =Font.'Open Sans'
                                    Height: =100
                                    HoverColor: =RGBA(255, 255, 255, 1)
                                    HoverFill: =RGBA(23, 20, 150, 1)
                                    OnSelect: |-
                                      =Set(varBuchung, ThisItem);
                                      Set(varBuchungID, ThisItem.ID);
                                      Set(varZeigeVerwalten, true)
                                    PressedColor: =RGBA(23, 20, 150, 1)
                                    PressedFill: =RGBA(255, 255, 255, 1)
                                    RadiusBottomLeft: =16
                                    RadiusBottomRight: =16
                                    RadiusTopLeft: =16
                                    RadiusTopRight: =16
                                    Text: ="Verwalten"
                                    Width: =(Parent.Width - 80) / 2
                                    X: =Parent.Width - 28 - (Parent.Width - 80) / 2
                                    Y: =150
