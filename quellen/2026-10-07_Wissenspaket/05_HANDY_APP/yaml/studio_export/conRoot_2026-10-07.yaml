                              HoverColor: =RGBA(255, 255, 255, 1)
                              HoverFill: =RGBA(23, 20, 150, 1)
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varTab, "buchen")
                              PressedColor: =RGBA(23, 20, 150, 1)
                              PressedFill: =RGBA(255, 255, 255, 1)
                              RadiusBottomLeft: =16
                              RadiusBottomRight: =16
                              RadiusTopLeft: =16
                              RadiusTopRight: =16
