Screens:
  Screen1:
    Properties:
      Fill: =RGBA(233, 233, 235, 1)
      LoadingSpinner: =LoadingSpinner.Data
      LoadingSpinnerColor: =RGBA(100, 118, 132, 1)
    Children:
      - conGrundriss:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            Height: =Parent.Height - (conHeader.Y + conHeader.Height) - 15
            RadiusBottomLeft: =16
            RadiusBottomRight: =16
            RadiusTopLeft: =16
            RadiusTopRight: =16
            Width: =Parent.Width - (conDashboard.X + conDashboard.Width) - 10
            X: =conDashboard.X + conDashboard.Width + 5
            Y: =conHeader.Y + conHeader.Height + 10
          Children:
            - imgGrundrissOG:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Height: =BasisHoehe * BasisSkalierung
                  Image: ='grundriss_transparent (1)'
                  Visible: =varAusgewaehltesStockwerk = "OG"
                  Width: =BasisBreite * BasisSkalierung
                  X: =(conGrundriss.Width - imgGrundrissOG.Width) / 2
                  Y: =(conGrundriss.Height - imgGrundrissOG.Height) / 2
            - imgGrundrissUG:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Height: =BasisHoehe * BasisSkalierung
                  Image: ='grundriss_UG_bearbeitet_PREVIEW (3)'
                  Visible: =varAusgewaehltesStockwerk = "UG"
                  Width: =BasisBreite * BasisSkalierung
                  X: =(conGrundriss.Width - imgGrundrissUG.Width) / 2
                  Y: =(conGrundriss.Height - imgGrundrissUG.Height) / 2
            - Gallery1:
                Control: Gallery@2.15.0
                Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                Properties:
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Height: =imgGrundrissOG.Height
                  Items: =Filter(Tische, Geschoss.Value = varAusgewaehltesStockwerk)
                  TemplateSize: =1
                  Width: =imgGrundrissOG.Width
                  X: =imgGrundrissOG.X
                  Y: =imgGrundrissOG.Y
                Children:
                  - Rectangle1:
                      Control: Rectangle@2.3.0
                      Properties:
                        BorderColor: =Color.Black
                        BorderThickness: =2
                        Fill: |-
                          =If(
                            ThisItem.Gesperrt,
                            ColorValue("#A6A6A6"),
                            With(
                              {
                                relevanteBuchung:
                                  If(
                                    varAnsichtsDatum = Today(),
                                    LookUp(colGrundriss, TischName = ThisItem.Titel && Endzeit >= Now() && Startzeit <= DateAdd(Now(), 30, TimeUnit.Minutes)),
                                    LookUp(colGrundriss, TischName = ThisItem.Titel && Startzeit >= varAnsichtsDatum && Startzeit < DateAdd(varAnsichtsDatum, 1, TimeUnit.Days))
                                  )
                              },
                              If(
                                IsBlank(relevanteBuchung),
                                ColorValue("#00A96B"),
                                If(
                                  relevanteBuchung.Eingecheckt,
                                  ColorValue("#EB3951"),
                                  ColorValue("#FFA500")
                                )
                              )
                            )
                          )
                        Height: |-
                          =(If(
                              varAusgewaehltesStockwerk = "OG",
                              If(
                              LookUp(colTischPositionen, Tisch = ThisItem.Titel).Ausrichtung = "Horizontal",
                              BasisKachelhoeheQuer,
                              BasisKachelhoeheHoch
                              ),
                              // Josias 2026-09-28: Big Table nutzt bewusst dieselbe Basishoehe wie andere horizontale Tische (kein eigener Hoehenwert)
                              If(
                              ThisItem.Titel = "Big Table",
                              BasisKachelhoeheQuerUG,
                              If(
                              LookUp(colTischPositionenUG, Tisch = ThisItem.Titel).Ausrichtung = "Horizontal",
                              BasisKachelhoeheQuerUG,
                              BasisKachelhoeheHochUG
                              )
                              )
                              ) - If(StartsWith(ThisItem.Titel, "Quiet Desk"), 7, 0)) * BasisSkalierung
                        OnSelect: =
                        Width: |-
                          =(If(
                              varAusgewaehltesStockwerk = "OG",
                              If(
                              LookUp(colTischPositionen, Tisch = ThisItem.Titel).Ausrichtung = "Horizontal",
                              BasisKachelbreiteQuer,
                              BasisKachelbreiteHoch
                              ),
                              // Josias 2026-09-28: Big Table bekommt eigene Breite statt Basisbreite (siehe BasisKachelbreiteBigTableUG)
                              If(
                              ThisItem.Titel = "Big Table",
                              BasisKachelbreiteBigTableUG,
                              If(
                              LookUp(colTischPositionenUG, Tisch = ThisItem.Titel).Ausrichtung = "Horizontal",
                              BasisKachelbreiteQuerUG,
                              BasisKachelbreiteHochUG
                              )
                              )
                              ) - If(StartsWith(ThisItem.Titel, "Quiet Desk"), 10, 0)) * BasisSkalierung
                        X: |-
                          =If(
                            varAusgewaehltesStockwerk = "OG",
                            LookUp(colTischPositionen, Tisch = ThisItem.Titel).X,
                            LookUp(colTischPositionenUG, Tisch = ThisItem.Titel).X
                          ) * BasisSkalierung
                        Y: |-
                          =With(
                            {
                              // Grundriss-Fix 2026-09-30: Gallery1 schiebt jeden Eintrag um (TemplateHeight + TemplatePadding) Pixel nach unten, unskaliert.
                              // Die Positionen wurden bei BasisSkalierungReferenz eingemessen (Versatz dort eingebaut) -> Versatz dieser Groesse mitskalieren, echten Versatz abziehen.
                              nrVersatz: LookUp(If(varAusgewaehltesStockwerk = "OG", TischNrOG, TischNrUG), Titel = ThisItem.Titel).Nr - 1,
                              vorlagenVersatz: Gallery1.TemplateHeight + Gallery1.TemplatePadding
                            },
                            (If(
                              varAusgewaehltesStockwerk = "OG",
                              LookUp(colTischPositionen, Tisch = ThisItem.Titel).Y,
                              LookUp(colTischPositionenUG, Tisch = ThisItem.Titel).Y
                            ) + nrVersatz * vorlagenVersatz / BasisSkalierungReferenz) * BasisSkalierung
                            - nrVersatz * vorlagenVersatz
                          )
                  - Circle1:
                      Control: Circle@2.3.0
                      Properties:
                        BorderColor: |-
                          =With(
                            { relevanteBuchung: LookUp(colGrundriss, TischName = ThisItem.Titel && Endzeit >= Now() && Startzeit <= DateAdd(Now(), 30, TimeUnit.Minutes)) },
                            If(IsBlank(relevanteBuchung), Color.Transparent, Color.Black)
                          )
                        BorderStyle: |-
                          =With(
                            {
                              istBesetzt:
                                If(
                                  varAnsichtsDatum = Today(),
                                  !IsBlank(LookUp(colGrundriss, TischName = ThisItem.Titel && Now() >= Startzeit && Now() <= Endzeit)),
                                  !IsBlank(LookUp(colGrundriss, TischName = ThisItem.Titel && Startzeit >= varAnsichtsDatum && Startzeit < DateAdd(varAnsichtsDatum, 1, TimeUnit.Days)))
                                ),
                              istAusstehend:
                                varAnsichtsDatum = Today() &&
                                !IsBlank(LookUp(colGrundriss, TischName = ThisItem.Titel && Startzeit > Now() && Startzeit <= DateAdd(Now(), 60, TimeUnit.Minutes)))
                            },
                            If(istBesetzt Or istAusstehend, BorderStyle.Solid, BorderStyle.None)
                          )
                        BorderThickness: =1
                        Fill: |-
                          =If(
                            ThisItem.Gesperrt,
                            Color.White,
                            With(
                              {
                                relevanteBuchung:
                                  If(
                                    varAnsichtsDatum = Today(),
                                    LookUp(colGrundriss, TischName = ThisItem.Titel && Endzeit >= Now() && Startzeit <= DateAdd(Now(), 30, TimeUnit.Minutes)),
                                    LookUp(colGrundriss, TischName = ThisItem.Titel && Startzeit >= varAnsichtsDatum && Startzeit < DateAdd(varAnsichtsDatum, 1, TimeUnit.Days))
                                  )
                              },
                              If(IsBlank(relevanteBuchung), ColorValue("#4DC398"), Color.White)
                            )
                          )
                        Height: |-
                          =If(
                            varAusgewaehltesStockwerk = "OG",
                            BasisKreisgroesse,
                            BasisKreisgroesseUG
                          ) * BasisSkalierung * varZoom
                        OnSelect: =
                        Width: |-
                          =If(
                            varAusgewaehltesStockwerk = "OG",
                            BasisKreisgroesse,
                            BasisKreisgroesseUG
                          ) * BasisSkalierung * varZoom
                        X: =Rectangle1.X + (Rectangle1.Width/2) - (Circle1.Width/2)
                        Y: =Rectangle1.Y + (Rectangle1.Height/2) - (Circle1.Height/2)
                  - Label1:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(32, 54, 71, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Bold
                        Height: =Circle1.Height
                        OnSelect: =
                        Size: |-
                          =If(
                            varAusgewaehltesStockwerk = "OG",
                            12,
                            BasisSchriftgroesseUG
                          ) * BasisSkalierung
                        Text: |-
                          =With(
                            {
                              relevanteBuchung:
                                If(
                                  varAnsichtsDatum = Today(),
                                  LookUp(colGrundriss, TischName = ThisItem.Titel && Endzeit >= Now() && Startzeit <= DateAdd(Now(), 30, TimeUnit.Minutes)),
                                  LookUp(colGrundriss, TischName = ThisItem.Titel && Startzeit >= varAnsichtsDatum && Startzeit < DateAdd(varAnsichtsDatum, 1, TimeUnit.Days))
                                )
                            },
                            If(
                              IsBlank(relevanteBuchung),
                              "",
                              Upper(Left(First(Split(relevanteBuchung.Name, " ")).Value, 1) &
                                    Left(Last(Split(relevanteBuchung.Name, " ")).Value, 1))
                            )
                          )
                        Width: =Circle1.Width + 4
                        X: =Circle1.X -2
                        Y: |+
                          =Circle1.Y
                  - btnHitArea:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =Color.Transparent
                        Font: =Font.'Open Sans'
                        Height: =Rectangle1.Height
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =RGBA(0, 0, 0, 0.1)
                        OnSelect: |-
                          =If(
                            ThisItem.Gesperrt,
                            Notify("Dieser Tisch ist zurzeit gesperrt.", NotificationType.Warning),
                            Set(varFreigabeGrenze, DateAdd(Now(), -Coalesce(varFreigabeMinuten, 30), TimeUnit.Minutes));
                            If(
                              varAnsichtsDatum = Today(),
                              ClearCollect(colKachel, Filter(Tischbuchungen, Tisch.Value = ThisItem.Titel && Endzeit >= Now() && Startzeit <= DateAdd(Now(), 30, TimeUnit.Minutes))),
                              ClearCollect(colKachel, Filter(Tischbuchungen, Tisch.Value = ThisItem.Titel && Startzeit >= varAnsichtsDatum && Startzeit < DateAdd(varAnsichtsDatum, 1, TimeUnit.Days)))
                            );
                            RemoveIf(colKachel, !CheckedIn && Startzeit <= varFreigabeGrenze && Erstellt <= varFreigabeGrenze);
                            Set(varKachelID, First(SortByColumns(colKachel, "Startzeit", SortOrder.Ascending)).ID);
                            If(
                              IsBlank(varKachelID),
                                Set(varSelectedTisch, ThisItem);
                                Set(varDialogJetzt, Now());
                                Reset(dpDatum);
                                Reset(ddStart);
                                Reset(ddEnde);
                                Reset(dpWiederholenBis);
                                Set(varZeigeDialog, true);
                                Set(varZeigeDetails, false);
                                Set(varZeigeCheckin, false);
                                Set(varZeigeVerwalten, false);
                                Set(varWiederholen, false);
                                Set(varWiederholenModus, "Wochentage");
                                Set(varTagMo, false);
                                Set(varTagDi, false);
                                Set(varTagMi, false);
                                Set(varTagDo, false);
                                Set(varTagFr, false);
                                Set(varTagSa, false);
                                Set(varTagSo, false),
                                Set(varDetailsTisch, ThisItem); Set(varSelectedBuchung, LookUp(Tischbuchungen, ID = varKachelID));
                                Set(varZeigeDetails, true);
                                Set(varZeigeDialog, false);
                                Set(varZeigeCheckin, false);
                                Set(varZeigeVerwalten, false)
                            )
                          )
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =ColorFade(Rectangle1.Fill, -30%)
                        Text: =
                        Width: =Rectangle1.Width
                        X: =Rectangle1.X
                        Y: =Rectangle1.Y
            - Image8:
                Control: Image@2.2.3
                Properties:
                  BorderColor: =RGBA(32, 54, 71, 1)
                  Height: =62
                  Image: =chevron_technoform
                  X: =ddStockwerk.X + 140
                  Y: '=ddStockwerk.Y '
