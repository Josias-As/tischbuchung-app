                          Notify("Diese Buchung gibt es nicht mehr. Bitte aktualisieren.", NotificationType.Warning);
                          Set(varZeigeCheckin, false),
                          Coalesce(varCheckinBuchung.CheckedIn, false) <> Coalesce(varSelectedBuchung.CheckedIn, false),
