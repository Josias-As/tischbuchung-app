- tglFuerAnderePanel:
    Control: Classic/Toggle@2.1.0
    Properties:
      BorderColor: |-
        =RGBA(32, 54, 71, 1)
      Color: |-
        =RGBA(0, 0, 0, 1)
      Default: =false
      FalseText: |-
        ="Für mich"
      Font: |-
        =Font.'Open Sans'
      Height: =28
      Size: =13
      TrueFill: |-
        =ColorValue("#00A96B")
      TrueText: |-
        ="Für andere"
      Width: =165
      X: =ddTischePanel.X
      Y: |-
        =(tglTagFr_1.Y + tglTagFr_1.Height + 20) + 6
- txtGastNamePanel:
    Control: Classic/TextInput@2.3.2
    Properties:
      BorderColor: |-
        =RGBA(32, 54, 71, 1)
      BorderThickness: =2
      Color: |-
        =RGBA(0, 0, 0, 1)
      Default: |-
        =""
      Fill: |-
        =RGBA(255, 255, 255, 1)
      Font: |-
        =Font.'Open Sans'
      Height: =40
      HintText: |-
        ="Name (Pflicht)"
      MaxLength: =100
      Size: =13
      Visible: =tglFuerAnderePanel.Value
      Width: |-
        =ddTischePanel.Width - 175
      X: |-
        =ddTischePanel.X + 175
      Y: |-
        =tglTagFr_1.Y + tglTagFr_1.Height + 20
